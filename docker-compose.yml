# Una base de datos por microservicio (US-111).
# Las contraseñas se leen de .env (copiar .env.example); no tienen valor por defecto.

services:
  proveedores-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: proveedores-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${PROVEEDORES_DB_SA_PASSWORD:?Defina PROVEEDORES_DB_SA_PASSWORD en .env}
    ports:
      - "1433:1433"
    volumes:
      - proveedores_data:/var/opt/mssql
      - ./db/proveedores:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  usuarios-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: usuarios-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${USUARIOS_DB_SA_PASSWORD:?Defina USUARIOS_DB_SA_PASSWORD en .env}
    ports:
      - "1434:1433"
    volumes:
      - usuarios_data:/var/opt/mssql
      - ./db/usuarios:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # SQL Server no ejecuta scripts al crear el volumen (a diferencia de MySQL y Mongo).
  # Estas dos tareas de una sola vez corren los scripts idempotentes de db/<servicio>
  # cuando la base está sana. Para repetirlas: docker compose run --rm usuarios-db-init
  proveedores-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: proveedores-db-init
    restart: "no"
    depends_on:
      proveedores-db:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${PROVEEDORES_DB_SA_PASSWORD:?Defina PROVEEDORES_DB_SA_PASSWORD en .env}
    volumes:
      - ./db/proveedores:/scripts:ro
    entrypoint: ["/bin/bash", "-c", "for f in /scripts/*.sql; do echo \"Ejecutando $$f\"; /opt/mssql-tools18/bin/sqlcmd -S proveedores-db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i \"$$f\" || exit 1; done"]

  usuarios-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: usuarios-db-init
    restart: "no"
    depends_on:
      usuarios-db:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${USUARIOS_DB_SA_PASSWORD:?Defina USUARIOS_DB_SA_PASSWORD en .env}
    volumes:
      - ./db/usuarios:/scripts:ro
    entrypoint: ["/bin/bash", "-c", "for f in /scripts/*.sql; do echo \"Ejecutando $$f\"; /opt/mssql-tools18/bin/sqlcmd -S usuarios-db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i \"$$f\" || exit 1; done"]

  clientes-db:
    image: mysql:8.4
    container_name: clientes-db
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      - MYSQL_ROOT_PASSWORD=${CLIENTES_DB_ROOT_PASSWORD:?Defina CLIENTES_DB_ROOT_PASSWORD en .env}
      - MYSQL_DATABASE=libreria_clientes
      - MYSQL_USER=${CLIENTES_DB_USUARIO:?Defina CLIENTES_DB_USUARIO en .env}
      - MYSQL_PASSWORD=${CLIENTES_DB_PASSWORD:?Defina CLIENTES_DB_PASSWORD en .env}
    ports:
      - "3306:3306"
    volumes:
      - clientes_data:/var/lib/mysql
      - ./db/clientes:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante la inicialización MySQL solo escucha por socket, así que
      # el contenedor no queda «healthy» hasta que terminan los scripts.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  productos-db:
    image: mongo:8.0
    container_name: productos-db
    environment:
      - MONGO_INITDB_DATABASE=libreria_productos
    ports:
      - "27017:27017"
    volumes:
      - productos_data:/data/db
      - ./db/productos:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Proveedor de identidad (US-124). Importa keycloak/realm-libreria.json solo si el realm
  # no existe; los secretos y los usuarios semilla los pone «keycloak-configurar».
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME:?Defina KC_BOOTSTRAP_ADMIN_USERNAME en .env}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD:?Defina KC_BOOTSTRAP_ADMIN_PASSWORD en .env}
      # Emisor fijo (iss = http://localhost:8080/realms/libreria) aunque se llame desde otro contenedor.
      - KC_HOSTNAME=http://localhost:8080
      - KC_HEALTH_ENABLED=true
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-libreria.json:/opt/keycloak/data/import/realm-libreria.json:ro
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready (puerto de gestión 9000) por /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Tarea de una sola vez: secretos de los clientes, admin y vendedor con sus GUID fijos.
  # Es idempotente; para repetirla: docker compose run --rm keycloak-configurar
  keycloak-configurar:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak-configurar
    entrypoint: ["/bin/bash", "/config/configurar.sh"]
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME:?Defina KC_BOOTSTRAP_ADMIN_USERNAME en .env}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD:?Defina KC_BOOTSTRAP_ADMIN_PASSWORD en .env}
      - KEYCLOAK_FRONT_CLIENT_SECRET=${KEYCLOAK_FRONT_CLIENT_SECRET:?Defina KEYCLOAK_FRONT_CLIENT_SECRET en .env}
      - KEYCLOAK_USUARIOS_ADMIN_CLIENT_SECRET=${KEYCLOAK_USUARIOS_ADMIN_CLIENT_SECRET:?Defina KEYCLOAK_USUARIOS_ADMIN_CLIENT_SECRET en .env}
      - KEYCLOAK_USUARIOS_VERIFICACION_CLIENT_SECRET=${KEYCLOAK_USUARIOS_VERIFICACION_CLIENT_SECRET:?Defina KEYCLOAK_USUARIOS_VERIFICACION_CLIENT_SECRET en .env}
      - KEYCLOAK_ADMIN_SEMILLA_PASSWORD=${KEYCLOAK_ADMIN_SEMILLA_PASSWORD:?Defina KEYCLOAK_ADMIN_SEMILLA_PASSWORD en .env}
      - KEYCLOAK_VENDEDOR_SEMILLA_PASSWORD=${KEYCLOAK_VENDEDOR_SEMILLA_PASSWORD:?Defina KEYCLOAK_VENDEDOR_SEMILLA_PASSWORD en .env}
      - KEYCLOAK_HABILITAR_CLIENTE_PRUEBAS=${KEYCLOAK_HABILITAR_CLIENTE_PRUEBAS:-false}
    volumes:
      - ./keycloak:/config:ro

volumes:
  proveedores_data:
  usuarios_data:
  clientes_data:
  productos_data:
  keycloak_data:
