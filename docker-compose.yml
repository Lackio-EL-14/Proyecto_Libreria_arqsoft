services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: libreria-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Libreria2026!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./db/init:/scripts:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Libreria2026!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: libreria-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app1:
    image: libreria-app:latest
    container_name: libreria-app1
    env_file:
      - .env
    volumes:
      - keys_data:/keys
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    image: libreria-app:latest
    container_name: libreria-app2
    env_file:
      - .env
    volumes:
      - keys_data:/keys
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  app3:
    image: libreria-app:latest
    container_name: libreria-app3
    env_file:
      - .env
    volumes:
      - keys_data:/keys
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  app4:
    image: libreria-app:latest
    container_name: libreria-app4
    env_file:
      - .env
    volumes:
      - keys_data:/keys
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: libreria-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
      - app4 

volumes:
  mssql_data:
  keys_data:
