events { 
    worker_connections 1024; 
}

http {
    upstream backend {
        # Configuración agresiva para detectar caídas rápidamente (US-57)
        server app1:8080 max_fails=2 fail_timeout=5s;
        server app2:8080 max_fails=2 fail_timeout=5s;
        server app3:8080 max_fails=2 fail_timeout=5s;
        server app4:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Encabezado para poder hacer curl y ver quién respondió
            add_header X-Served-By $upstream_addr always;
            
            # Timeouts bajos para saltar a la siguiente réplica si una falla
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}
